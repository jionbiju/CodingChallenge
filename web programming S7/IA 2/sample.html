<!doctype html>
<html>
  <head>
    <title>Largest of Three Numbers</title>

    <script>
      var a = Number(prompt("Enter first number:"));
      var b = Number(prompt("Enter second number:"));
      var c = Number(prompt("Enter third number:"));

      var largest;

      if (a >= b && a >= c) {
        largest = a;
      } else if (b >= a && b >= c) {
        largest = b;
      } else {
        largest = c;
      }

      document.write("Largest number = " + largest);
    </script>
  </head>

  <body></body>
</html>
